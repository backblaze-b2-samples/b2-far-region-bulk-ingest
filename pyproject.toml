[project]
name = "b2-far-region-bulk-ingest"
version = "0.1.0"
description = "A Backblaze B2 sample using boto3 over the S3-compatible API."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["boto3==1.43.115"]

[dependency-groups]
dev = [
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "moto[s3]==5.2.6",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
